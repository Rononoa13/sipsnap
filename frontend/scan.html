<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Menu - SipSnap</title>
</head>
<body>
    <main>
        <h1>Scan a Menu</h1>
        <p>
            Take a photo of the menu or choose one from your device.
        </p>

        <label for="camera-input">Take Photo</label>
        <input
            type="file"
            accept="image/*"
            capture="environment"
            id="camera-input"
        />
        
        <label for="camera-input">Choose Photo</label>
        <input
            type="file"
            accept="image/*"
            id="file-input"
            hidden
        />
        <p id="error-message" hidden></p>
        <img
            id="preview"
            alt="Selected menu"
            hidden
        >
        <button id="scan-button" type="button" hidden>
            Scan Menu
        </button>
        
    </main>

    <script src="/js/camera.js"></script>
</body>
</html>
