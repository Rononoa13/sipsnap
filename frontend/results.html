<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Your scanned menu."
    >

    <title>Menu — SipSnap</title>
</head>

<body>
    <main>
        <header>
            <h1>Your Menu</h1>
            <p>Here's what SipSnap found.</p>
        </header>

        <section id="menu-results">
            <!-- Menu items will appear here. -->
        </section>

        <p id="results-error" hidden>
            We couldn't load your menu.
        </p>

        <button id="scan-again" type="button">
            Scan Another Menu
        </button>
    </main>

    <script src="/js/results.js"></script>
</body>
</html>
